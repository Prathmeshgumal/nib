name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so the hosted store is tested as it will run rather than
    # assumed to behave like SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nib
          POSTGRES_DB: nibtest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NIB_TEST_POSTGRES: postgres://postgres:nib@localhost:5432/nibtest?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^client/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The same script contributors run, so CI cannot drift from it.
      - name: Build the binary
        run: ./build.sh

      - name: Smoke test
        run: |
          ./nib --version
          ./nib --web --port 4321 --db /tmp/ci.db &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4321/api/health
          curl -sf http://127.0.0.1:4321/ -o /dev/null

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci
        working-directory: client

      - name: Test
        run: npm test
        working-directory: client
